<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- White circle container for icon -->
  <circle cx="256" cy="256" r="160" fill="#ffffff" shadow="0 10px 25px rgba(0,0,0,0.15)" />

  <!-- Shopping Cart Icon -->
  <g transform="translate(160, 150) scale(4.5)">
    <!-- Cart wheels -->
    <circle cx="12" cy="20" r="2.5" fill="#0284c7" />
    <circle cx="24" cy="20" r="2.5" fill="#0284c7" />
    
    <!-- Cart body -->
    <path d="M2.5 4H6l3.6 13.5a1.5 1.5 0 0 0 1.5 1.1h14.8a1.5 1.5 0 0 0 1.5-1.1L29.5 8H8" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Big Plus symbol overlay -->
  <circle cx="340" cy="172" r="64" fill="#0284c7" stroke="#ffffff" stroke-width="8" />
  <path d="M340 136 v72 M304 172 h72" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
